# Loki single-binary — desktop-local (SPEC §7.4)
# 7-day retention; OTLP ingestion with structured metadata.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
  # Enable OTLP ingestion path (confirm field names against pinned chart)
  otlp_config: {}

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

gateway:
  enabled: true

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Chart version may use different keys for OTLP; validate before apply.
# Destination from collector: http://loki-gateway.agent-observability.svc.cluster.local/otlp
